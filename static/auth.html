<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录或注册</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-alt: #f7faff;
      --border: #dbe5f1;
      --text: #1c2434;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #e8f0ff;
      --success: #15803d;
      --danger: #dc2626;
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
      --radius-lg: 24px;
      --radius-md: 14px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }

    button,
    input {
      font: inherit;
    }

    .auth-shell {
      width: min(100%, 960px);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    .hero,
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(37, 99, 235, 0.02)),
        var(--panel);
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    .hero p {
      margin: 0 0 18px;
      line-height: 1.7;
      color: var(--muted);
    }

    .hero-list {
      display: grid;
      gap: 10px;
    }

    .hero-item {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-alt);
    }

    .hero-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .panel {
      padding: 24px;
    }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    .switcher {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      padding: 6px;
      border-radius: var(--radius-pill);
      background: var(--panel-alt);
    }

    .switcher button {
      flex: 1;
      border: 0;
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: #475569;
    }

    .switcher button.active {
      background: var(--primary);
      color: #fff;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      background: #fff;
      color: var(--text);
    }

    .field input:focus {
      outline: none;
      border-color: #90b3ff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .hint {
      margin-top: -4px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 14px;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .footer-actions {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-actions a {
      color: var(--primary);
      text-decoration: none;
    }

    @media (max-width: 860px) {
      .auth-shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <section class="hero">
      <h1>RAG 登录中心</h1>
      <p>登录后才能访问你的聊天记录、文件资料库和向量检索结果。注册成功后会自动登录并跳回主页面。</p>
      <div class="hero-list">
        <div class="hero-item">
          <strong>用户隔离</strong>
          <span>每个用户只会看到自己的文件、会话和检索结果。</span>
        </div>
        <div class="hero-item">
          <strong>自动续用</strong>
          <span>登录成功后会自动保存会话，后续打开页面直接恢复。</span>
        </div>
        <div class="hero-item">
          <strong>统一入口</strong>
          <span>注册和登录都在这个页面完成，主页面不再嵌入账号表单。</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 id="formTitle">登录账号</h2>
      <p id="formSubtitle">输入已有用户名和密码后进入聊天页。</p>

      <div class="switcher">
        <button id="loginTabBtn" class="active" type="button">登录</button>
        <button id="registerTabBtn" type="button">注册</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="usernameInput">用户名</label>
          <input id="usernameInput" type="text" autocomplete="username" placeholder="至少 3 个字符">
        </div>
        <div class="field">
          <label for="passwordInput">密码</label>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="至少 6 个字符">
        </div>
        <div id="confirmPasswordField" class="field" hidden>
          <label for="confirmPasswordInput">确认密码</label>
          <input id="confirmPasswordInput" type="password" autocomplete="new-password" placeholder="再次输入密码">
        </div>
        <div class="hint" id="modeHint">已有账号可直接登录。</div>
        <button id="submitBtn" class="primary" type="submit">立即登录</button>
        <div id="authStatus" class="status"></div>
      </form>

      <div class="footer-actions">
        <span>默认跳转到聊天页</span>
        <a href="/library">直接去资料库</a>
      </div>
    </section>
  </div>

  <script>
    const AUTH_TOKEN_STORAGE_KEY = "rag_auth_token_v1";
    const AUTH_USER_STORAGE_KEY = "rag_auth_user_v1";

    const loginTabBtn = document.getElementById("loginTabBtn");
    const registerTabBtn = document.getElementById("registerTabBtn");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const modeHint = document.getElementById("modeHint");
    const authForm = document.getElementById("authForm");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const confirmPasswordField = document.getElementById("confirmPasswordField");
    const confirmPasswordInput = document.getElementById("confirmPasswordInput");
    const submitBtn = document.getElementById("submitBtn");
    const authStatus = document.getElementById("authStatus");

    const state = {
      mode: "login"
    };

    function getRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (next && next.startsWith("/")) {
        return next;
      }
      return "/";
    }

    function setStatus(message, type) {
      authStatus.textContent = message || "";
      authStatus.className = type ? `status ${type}` : "status";
    }

    function saveAuthSession(payload) {
      window.localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, payload.access_token);
      window.localStorage.setItem(AUTH_USER_STORAGE_KEY, JSON.stringify(payload.user));
    }

    function getStoredToken() {
      return window.localStorage.getItem(AUTH_TOKEN_STORAGE_KEY) || "";
    }

    function switchMode(mode) {
      state.mode = mode === "register" ? "register" : "login";
      const isRegister = state.mode === "register";

      loginTabBtn.classList.toggle("active", !isRegister);
      registerTabBtn.classList.toggle("active", isRegister);
      confirmPasswordField.hidden = !isRegister;
      submitBtn.textContent = isRegister ? "立即注册" : "立即登录";
      formTitle.textContent = isRegister ? "注册账号" : "登录账号";
      formSubtitle.textContent = isRegister
        ? "创建新账号后会自动登录并跳转到主页面。"
        : "输入已有用户名和密码后进入聊天页。";
      modeHint.textContent = isRegister
        ? "用户名至少 3 个字符，密码至少 6 个字符。"
        : "已有账号可直接登录。";
      setStatus("");
    }

    async function restoreSession() {
      const token = getStoredToken();
      if (!token) {
        return false;
      }

      try {
        const response = await fetch("/auth/me", {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        if (!response.ok) {
          throw new Error("登录状态已失效");
        }
        window.location.replace(getRedirectTarget());
        return true;
      } catch (error) {
        window.localStorage.removeItem(AUTH_TOKEN_STORAGE_KEY);
        window.localStorage.removeItem(AUTH_USER_STORAGE_KEY);
        return false;
      }
    }

    async function submitAuth(event) {
      event.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const isRegister = state.mode === "register";

      if (!username || !password) {
        setStatus("请输入用户名和密码。", "error");
        return;
      }

      if (isRegister && password !== confirmPassword) {
        setStatus("两次输入的密码不一致。", "error");
        return;
      }

      submitBtn.disabled = true;
      setStatus(isRegister ? "正在注册..." : "正在登录...");

      try {
        const endpoint = isRegister ? "/auth/register" : "/auth/login";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username: username, password: password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || (isRegister ? "注册失败" : "登录失败"));
        }

        saveAuthSession(data);
        setStatus(isRegister ? "注册成功，正在跳转..." : "登录成功，正在跳转...", "success");
        window.setTimeout(() => {
          window.location.replace(getRedirectTarget());
        }, 300);
      } catch (error) {
        setStatus(error.message || (isRegister ? "注册失败" : "登录失败"), "error");
      } finally {
        submitBtn.disabled = false;
      }
    }

    loginTabBtn.addEventListener("click", () => switchMode("login"));
    registerTabBtn.addEventListener("click", () => switchMode("register"));
    authForm.addEventListener("submit", submitAuth);

    restoreSession();
  </script>
</body>
</html>
